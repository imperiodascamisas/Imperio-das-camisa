<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pedidos — Império das Camisas</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #050505;
    border-bottom: 1px solid #292929;
    padding: 18px 25px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    color: #d4af37;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    display: block;
    color: #fff;
    font-size: 8px;
    letter-spacing: 4px;
    margin-top: 3px;
}

.header-direita {
    display: flex;
    align-items: center;
    gap: 10px;
}

.usuario {
    color: #aaa;
    font-size: 13px;
}

button {
    cursor: pointer;
}

.btn-sair {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 9px 14px;
    border-radius: 5px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 35px 20px;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
}

.topo h1 {
    margin: 0;
    color: #d4af37;
}

.topo p {
    color: #888;
}

.btn-atualizar {
    background: #d4af37;
    color: #000;
    border: none;
    padding: 12px 18px;
    border-radius: 5px;
    font-weight: bold;
}

.estatisticas {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 30px;
}

.card-estatistica {
    background: #111;
    border: 1px solid #292929;
    border-radius: 7px;
    padding: 20px;
}

.card-estatistica span {
    display: block;
    color: #888;
    font-size: 13px;
    margin-bottom: 10px;
}

.card-estatistica strong {
    color: #d4af37;
    font-size: 27px;
}

.lista {
    display: grid;
    gap: 18px;
}

.pedido {
    background: #111;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 22px;
}

.pedido-cabecalho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    border-bottom: 1px solid #292929;
    padding-bottom: 15px;
    margin-bottom: 18px;
}

.pedido-numero {
    color: #d4af37;
    font-size: 19px;
    font-weight: bold;
}

.data {
    color: #777;
    font-size: 12px;
    margin-top: 5px;
}

.status {
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-pendente {
    background: #3b3217;
    color: #d4af37;
}

.status-pago {
    background: #173b22;
    color: #66d98a;
}

.status-enviado {
    background: #172d3b;
    color: #67b9e8;
}

.status-concluido {
    background: #183b32;
    color: #61d8b1;
}

.status-cancelado {
    background: #3b1919;
    color: #ff7777;
}

.dados {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.bloco h3 {
    color: #d4af37;
    font-size: 14px;
    margin: 0 0 10px;
}

.bloco p {
    margin: 5px 0;
    color: #ccc;
    font-size: 14px;
}

.produtos {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #292929;
}

.produto {
    padding: 12px;
    background: #080808;
    border: 1px solid #222;
    margin-bottom: 8px;
    border-radius: 5px;
}

.produto strong {
    color: #fff;
}

.produto small {
    display: block;
    color: #888;
    margin-top: 5px;
}

.total-pedido {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #292929;
}

.total-pedido span {
    color: #aaa;
}

.total-pedido strong {
    color: #d4af37;
    font-size: 23px;
}

.acoes {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
}

.acoes button {
    padding: 9px 12px;
    border-radius: 4px;
    border: 1px solid #444;
    background: #080808;
    color: #fff;
}

.whatsapp {
    border-color: #2bb673 !important;
    color: #5de09a !important;
}

.status-select {
    background: #080808;
    color: white;
    border: 1px solid #444;
    padding: 9px;
    border-radius: 4px;
}

.vazio {
    text-align: center;
    background: #111;
    border: 1px solid #292929;
    padding: 60px 20px;
    border-radius: 8px;
    color: #888;
}

#login {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: #111;
    border: 1px solid #292929;
    padding: 30px;
    border-radius: 8px;
}

.login-box h1 {
    color: #d4af37;
    text-align: center;
}

.login-box p {
    color: #888;
    text-align: center;
}

.campo {
    margin-bottom: 15px;
}

.campo label {
    display: block;
    margin-bottom: 7px;
    font-size: 13px;
}

.campo input {
    width: 100%;
    padding: 13px;
    background: #080808;
    color: white;
    border: 1px solid #444;
    border-radius: 4px;
}

.btn-login {
    width: 100%;
    padding: 14px;
    background: #d4af37;
    color: #000;
    border: none;
    border-radius: 4px;
    font-weight: bold;
}

.erro {
    color: #ff7777;
    text-align: center;
    margin-top: 15px;
    font-size: 13px;
}

#painel {
    display: none;
}

@media(max-width:800px) {
    .estatisticas {
        grid-template-columns: repeat(2, 1fr);
    }

    .dados {
        grid-template-columns: 1fr;
    }
}

@media(max-width:500px) {
    header {
        padding: 15px;
    }

    .usuario {
        display: none;
    }

    .estatisticas {
        grid-template-columns: 1fr 1fr;
    }

    .topo {
        align-items: flex-start;
        flex-direction: column;
    }

    .pedido-cabecalho {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<section id="login">

    <div class="login-box">

        <h1>IMPÉRIO</h1>

        <p>
            Painel administrativo
        </p>

        <div class="campo">
            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Seu e-mail"
            >
        </div>

        <div class="campo">
            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
            >
        </div>

        <button
            class="btn-login"
            onclick="entrar()"
        >
            ENTRAR
        </button>

        <div
            id="erroLogin"
            class="erro"
        ></div>

    </div>

</section>


<section id="painel">

<header>

    <div class="logo">
        IMPÉRIO
        <span>DAS CAMISAS</span>
    </div>

    <div class="header-direita">

        <span
            id="usuario"
            class="usuario"
        ></span>

        <button
            class="btn-sair"
            onclick="sair()"
        >
            SAIR
        </button>

    </div>

</header>


<main class="container">

    <div class="topo">

        <div>
            <h1>📦 Pedidos</h1>

            <p>
                Gerencie os pedidos da sua loja.
            </p>
        </div>

        <button
            class="btn-atualizar"
            onclick="carregarPedidos()"
        >
            ↻ ATUALIZAR
        </button>

    </div>


    <div class="estatisticas">

        <div class="card-estatistica">
            <span>Total de pedidos</span>
            <strong id="totalPedidos">0</strong>
        </div>

        <div class="card-estatistica">
            <span>Pendentes</span>
            <strong id="pendentes">0</strong>
        </div>

        <div class="card-estatistica">
            <span>Concluídos</span>
            <strong id="concluidos">0</strong>
        </div>

        <div class="card-estatistica">
            <span>Faturamento</span>
            <strong id="faturamento">
                R$ 0,00
            </strong>
        </div>

    </div>


    <div
        id="listaPedidos"
        class="lista"
    ></div>

</main>

</section>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ezptdkqgeijhwatcbazu.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_s3eson_YIFJZsbRhy2LCQg_jNbnLfWe";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function verificarSessao() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient
        .auth
        .getSession();

    if(session) {

        mostrarPainel(
            session.user
        );

    } else {

        document
            .getElementById("login")
            .style.display =
                "flex";

    }

}


async function entrar() {

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const senha =
        document
        .getElementById("senha")
        .value;

    const erro =
        document
        .getElementById("erroLogin");


    erro.innerText = "";


    if(!email || !senha) {

        erro.innerText =
            "Preencha e-mail e senha.";

        return;

    }


    const {
        data,
        error
    } =
        await supabaseClient
        .auth
        .signInWithPassword({

            email: email,

            password: senha

        });


    if(error) {

        erro.innerText =
            "E-mail ou senha incorretos.";

        return;

    }


    mostrarPainel(
        data.user
    );

}


function mostrarPainel(user) {

    document
        .getElementById("login")
        .style.display =
            "none";

    document
        .getElementById("painel")
        .style.display =
            "block";

    document
        .getElementById("usuario")
        .innerText =
            user.email;

    carregarPedidos();

}


async function sair() {

    await supabaseClient
        .auth
        .signOut();

    location.reload();

}


async function carregarPedidos() {

    const lista =
        document
        .getElementById("listaPedidos");

    lista.innerHTML =
        "<div class='vazio'>Carregando pedidos...</div>";


    const {
        data,
        error
    } =
        await supabaseClient
        .from("pedidos")
        .select("*")
        .order(
            "created_at",
            {
                ascending: false
            }
        );


    if(error) {

        lista.innerHTML =
            "<div class='vazio'>Erro ao carregar pedidos.</div>";

        console.error(error);

        return;

    }


    atualizarEstatisticas(data);


    if(!data || data.length === 0) {

        lista.innerHTML =
            `
            <div class="vazio">

                📦

                <h2>
                    Nenhum pedido ainda
                </h2>

                <p>
                    Os pedidos realizados na loja aparecerão aqui.
                </p>

            </div>
            `;

        return;

    }


    lista.innerHTML = "";


    data.forEach(
        function(pedido) {

            const dataPedido =
                pedido.created_at
                ?
                new Date(
                    pedido.created_at
                ).toLocaleString(
                    "pt-BR"
                )
                :
                "";


            const status =
                pedido.status ||
                "Pendente";


            const classeStatus =
                status
                .toLowerCase()
                .normalize("NFD")
                .replace(
                    /[\u0300-\u036f]/g,
                    ""
                )
                .replace(
                    " ",
                    "-"
                );


            let produtosHTML = "";


            let produtos =
                pedido.produtos;


            if(typeof produtos === "string") {

                try {

                    produtos =
                        JSON.parse(
                            produtos
                        );

                } catch(e) {

                    produtos = [];

                }

            }


            if(Array.isArray(produtos)) {

                produtos.forEach(
                    function(produto) {

                        produtosHTML += `

                        <div class="produto">

                            <strong>
                                ${escapeHTML(
                                    produto.nome ||
                                    "Produto"
                                )}
                            </strong>

                            <small>

                                Tamanho:
                                ${escapeHTML(
                                    produto.tamanho ||
                                    "-"
                                )}

                                |

                                Quantidade:
                                ${produto.quantidade || 1}

                            </small>

                        </div>

                        `;

                    }
                );

            }


            lista.innerHTML += `

            <div class="pedido">

                <div class="pedido-cabecalho">

                    <div>

                        <div class="pedido-numero">

                            Pedido #${escapeHTML(
                                pedido.numero_pedido ||
                                pedido.id
                            )}

                        </div>

                        <div class="data">

                            ${dataPedido}

                        </div>

                    </div>

                    <span
                        class="status status-${classeStatus}"
                    >
                        ${escapeHTML(status)}
                    </span>

                </div>


                <div class="dados">

                    <div class="bloco">

                        <h3>👤 Cliente</h3>

                        <p>
                            <strong>Nome:</strong>
                            ${escapeHTML(
                                pedido.nome || "-"
                            )}
                        </p>

                        <p>
                            <strong>Telefone:</strong>
                            ${escapeHTML(
                                pedido.telefone || "-"
                            )}
                        </p>

                    </div>


                    <div class="bloco">

                        <h3>📍 Entrega</h3>

                        <p>

                            ${escapeHTML(
                                pedido.rua || ""
                            )},

                            ${escapeHTML(
                                pedido.numero || ""
                            )}

                        </p>

                        <p>

                            ${escapeHTML(
                                pedido.bairro || ""
                            )}

                            -

                            ${escapeHTML(
                                pedido.cidade || ""
                            )}

                            /

                            ${escapeHTML(
                                pedido.estado || ""
                            )}

                        </p>

                        <p>

                            CEP:
                            ${escapeHTML(
                                pedido.cep || "-"
                            )}

                        </p>

                    </div>


                    <div class="bloco">

                        <h3>💳 Pagamento</h3>

                        <p>
                            ${escapeHTML(
                                pedido.pagamento || "-"
                            )}
                        </p>

                    </div>


                    <div class="bloco">

                        <h3>🚚 Entrega</h3>

                        <p>
                            ${escapeHTML(
                                pedido.entrega || "-"
                            )}
                        </p>

                    </div>

                </div>


                <div class="produtos">

                    <h3>
                        👕 Produtos
                    </h3>

                    ${produtosHTML}

                </div>


                <div class="total-pedido">

                    <span>
                        Total
                    </span>

                    <strong>

                        R$

                        ${Number(
                            pedido.total || 0
                        )
                        .toFixed(2)
                        .replace(
                            ".",
                            ","
                        )}

                    </strong>

                </div>


                <div class="acoes">

                    <select
                        class="status-select"
                        onchange="alterarStatus(
                            ${pedido.id},
                            this.value
                        )"
                    >

                        <option
                            ${status === "Pendente" ? "selected" : ""}
                        >
                            Pendente
                        </option>

                        <option
                            ${status === "Pago" ? "selected" : ""}
                        >
                            Pago
                        </option>

                        <option
                            ${status === "Enviado" ? "selected" : ""}
                        >
                            Enviado
                        </option>

                        <option
                            ${status === "Concluído" ? "selected" : ""}
                        >
                            Concluído
                        </option>

                        <option
                            ${status === "Cancelado" ? "selected" : ""}
                        >
                            Cancelado
                        </option>

                    </select>


                    <button
                        class="whatsapp"
                        onclick="abrirWhatsApp(
                            '${escapeJS(
                                pedido.telefone || ""
                            )}',
                            '${escapeJS(
                                pedido.numero_pedido ||
                                pedido.id
                            )}'
                        )"
                    >
                        💬 WhatsApp
                    </button>

                    <button
                        onclick="excluirPedido(
                            ${pedido.id}
                        )"
                    >
                        🗑 Excluir
                    </button>

                </div>

            </div>

            `;

        }
    );

}


async function alterarStatus(
    id,
    novoStatus
) {

    const {
        error
    } =
        await supabaseClient
        .from("pedidos")
        .update({

            status: novoStatus

        })
        .eq(
            "id",
            id
        );


    if(error) {

        alert(
            "Não foi possível alterar o status."
        );

        console.error(error);

        return;

    }


    carregarPedidos();

}


async function excluirPedido(id) {

    const confirmar =
        confirm(
            "Tem certeza que deseja excluir este pedido?"
        );


    if(!confirmar) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
        .from("pedidos")
        .delete()
        .eq(
            "id",
            id
        );


    if(error) {

        alert(
            "Não foi possível excluir o pedido."
        );

        console.error(error);

        return;

    }


    carregarPedidos();

}


function abrirWhatsApp(
    telefone,
    numero
) {

    let numeroLimpo =
        telefone.replace(
            /\D/g,
            ""
        );


    if(
        numeroLimpo.length === 10 ||
        numeroLimpo.length === 11
    ) {

        numeroLimpo =
            "55" +
            numeroLimpo;

    }


    const mensagem =
        encodeURIComponent(
            "Olá! Aqui é do Império das Camisas. Estou entrando em contato sobre o seu pedido #" +
            numero +
            "."
        );


    window.open(
        "https://wa.me/" +
        numeroLimpo +
        "?text=" +
        mensagem,
        "_blank"
    );

}


function atualizarEstatisticas(
    pedidos
) {

    document
        .getElementById(
            "totalPedidos"
        )
        .innerText =
            pedidos.length;


    const pendentes =
        pedidos.filter(
            function(p) {

                return (
                    !p.status ||
                    p.status === "Pendente"
                );

            }
        ).length;


    const concluidos =
        pedidos.filter(
            function(p) {

                return (
                    p.status ===
                    "Concluído"
                );

            }
        ).length;


    const faturamento =
        pedidos.reduce(
            function(total,p) {

                if(
                    p.status !==
                    "Cancelado"
                ) {

                    return total +
                        Number(
                            p.total || 0
                        );

                }

                return total;

            },
            0
        );


    document
        .getElementById(
            "pendentes"
        )
        .innerText =
            pendentes;


    document
        .getElementById(
            "concluidos"
        )
        .innerText =
            concluidos;


    document
        .getElementById(
            "faturamento"
        )
        .innerText =

            "R$ " +

            faturamento
            .toFixed(2)
            .replace(
                ".",
                ","
            );

}


function escapeHTML(
    valor
) {

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJS(
    valor
) {

    return String(
        valor ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}


verificarSessao();

</script>

</body>
</html>
